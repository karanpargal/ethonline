packages:
  - apps/*
  - packages/*
# esbuild@0.28.x postinstall fails on this machine (binary version mismatch via
# pnpm cache); tsx 4.20.x uses esbuild 0.25.x which installs cleanly.
overrides:
  tsx: 4.20.6
allowBuilds:
  '@reown/appkit': false
  better-sqlite3: true
  bufferutil: false
  esbuild: true
  keccak: false
  unrs-resolver: true
  utf-8-validate: false
minimumReleaseAgeExclude:
  - '@next/env@16.3.5'
  - '@next/eslint-plugin-next@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - eslint-config-next@16.3.5
  - next@16.3.5
